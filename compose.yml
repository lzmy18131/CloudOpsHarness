services:
  # Optional MongoDB for history/checkpoint persistence experiments.
  # The default file/SQLite storage works without any external service.
  mongo:
    image: mongo:7.0
    container_name: aegisops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  aegisops:
    build: .
    container_name: aegisops
    env_file:
      - .env
    environment:
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: 8090
      AEGIS_STORAGE_BACKEND: ${AEGIS_STORAGE_BACKEND:-file}
      AEGIS_MONGO_URI: mongodb://mongo:27017
      AEGIS_SANDBOX_BACKEND: ${AEGIS_SANDBOX_BACKEND:-local}
    ports:
      - "8090:8090"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - aegisops-data:/app/data

volumes:
  mongo-data:
  aegisops-data:
