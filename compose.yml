services:
  # Optional MongoDB for history/checkpoint persistence experiments.
  # The default file/SQLite storage works without any external service.
  mongo:
    image: mongo:7.0
    container_name: cloudops_harness-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudops_harness:
    build: .
    container_name: cloudops_harness
    env_file:
      - .env
    environment:
      CLOUDOPS_HOST: 0.0.0.0
      CLOUDOPS_PORT: 8090
      CLOUDOPS_STORAGE_BACKEND: ${CLOUDOPS_STORAGE_BACKEND:-file}
      CLOUDOPS_MONGO_URI: mongodb://mongo:27017
      CLOUDOPS_SANDBOX_BACKEND: ${CLOUDOPS_SANDBOX_BACKEND:-local}
    ports:
      - "8090:8090"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - cloudops_harness-data:/app/data

volumes:
  mongo-data:
  cloudops_harness-data:
